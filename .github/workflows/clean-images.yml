---
name: Daily Image Cleanup
on:
  # # every day at 01:30am
  # schedule:
  #   - cron: '30 1 * * *'
  # or manually
  workflow_dispatch:
jobs:
  ghcr-cleanup-image:
    name: ghcr cleanup action
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete old tags
        uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
        with:
          packages: "zarf/rook-ceph"
          use-regex: true
          exclude-tags: "^v\\d+\\.\\d+\\.\\d+-upstream$"
          token: '${{ secrets.GITHUB_TOKEN }}'
          keep-n-untagged: 0
          keep-n-tagged: 0

      - name: Validate images
        uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
        with:
          packages: "zarf/rook-ceph"
          token: ${{ secrets.GITHUB_TOKEN }}
          validate: true
          delete-ghost-images: true
          delete-orphaned-images: true
          delete-untagged: true
