---
# yaml-language-server: $schema=https://raw.githubusercontent.com/zarf-dev/zarf/main/zarf.schema.json
apiVersion: zarf.dev/v1beta1
kind: ZarfPackageConfig
metadata:
  name: csi-rook-ceph
  # renovate-version: datasource=docker depName=ghcr.io/rook/rook-ceph
  version: v1.21.3
  annotations:
    org.opencontainers.image.source: "https://github.com/colonel-byte/zarf-csi-rook-ceph"
    org.opencontainers.image.description: Zarf package for deploying rook-ceph
x-charts:
  cluster:
    # renovate: datasource=docker depName=ghcr.io/rook/rook-ceph-cluster
    - name: ghcr.io/rook/rook-ceph-cluster:1.21.3
  operator:
    # renovate: datasource=docker depName=ghcr.io/rook/rook-ceph
    - name: ghcr.io/rook/rook-ceph:1.21.3
values:
  files:
    - values.yaml
components:
  - name: operator-images
    optional: true
    selector:
      flavor: upstream
    images:
      - name: ghcr.io/rook/ceph:v1.21.2
      - name: ghcr.io/rook/rook-ceph:1.21.2
      - name: quay.io/cephcsi/ceph-csi-operator:v1.1.0
      - name: quay.io/cephcsi/cephcsi:v3.18.1
      - name: quay.io/csiaddons/k8s-sidecar:v0.15.1
      - name: registry.k8s.io/sig-storage/csi-attacher:v4.13.0
      - name: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.18.0
      - name: registry.k8s.io/sig-storage/csi-provisioner:v6.3.0
      - name: registry.k8s.io/sig-storage/csi-resizer:v2.2.1
      - name: registry.k8s.io/sig-storage/csi-snapshotter:v8.6.0
  - name: cluster-images
    optional: true
    selector:
      flavor: upstream
    images:
      - name: ghcr.io/rook/rook-ceph-cluster:1.21.2
      - name: quay.io/ceph/ceph:v20.2.4
  - name: operator-seed-chart
    optional: true
    selector:
      flavor: upstream
    import:
      local:
        - path: ./operator/component.yaml
    charts:
      - name: rook-ceph
        valuesFiles:
          - path: values/upstream-operator-seed.yml
            enableTemplating: true
  - name: cluster-seed-chart
    optional: true
    selector:
      flavor: upstream
    import:
      local:
        - path: ./cluster/component.yaml
    charts:
      - name: rook-ceph-cluster
        valuesFiles:
          - path: values/upstream-cluster-seed.yml
            enableTemplating: true
  - name: operator-chart
    optional: true
    selector:
      flavor: upstream
    import:
      local:
        - path: ./operator/component.yaml
    charts:
      - name: rook-ceph
        valuesFiles:
          - path: values/upstream-operator.yml
  - name: cluster-chart
    optional: true
    selector:
      flavor: upstream
    import:
      local:
        - path: ./cluster/component.yaml
    charts:
      - name: rook-ceph-cluster
        valuesFiles:
          - path: values/upstream-cluster.yml
  - name: registry-bucket
    optional: true
    manifests:
      - name: registry-bucket
        namespace: zarf
        enableTemplating: true
        files:
          - manifests/obc-registry-bucket.yaml
    actions:
      onDeploy:
        onSuccess:
          - wait:
              cluster:
                kind: ObjectBucketClaim
                name: registry-bucket
                condition: "'{.status.phase}'=Bound"
                namespace: zarf
            maxTotalSeconds: 2700
            description: Waiting for ceph bucket to be created and bound
